name: Deploy App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-appservice-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - name: Check OIDC deployment prerequisites
        shell: bash
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME; do
            value="${!name}"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::Missing repository variable $name; see BSA/docs/DEPLOYMENT.md"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: BSA/package-lock.json
      - run: npm ci
        working-directory: BSA
      - run: npm run build
        working-directory: BSA
      - name: Package the built static site
        working-directory: BSA/dist
        run: |
          test -f server.mjs && test -f hosting.config.json && test -f build-info.json && test -f index.html
          zip -qr "$RUNNER_TEMP/site.zip" .
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to the existing App Service
        run: |
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --src-path "$RUNNER_TEMP/site.zip" --type zip --clean true --restart true --output none
      - name: Verify deployed commit, deep links and strict headers
        run: |
          host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)
          node BSA/scripts/verify-deployment.mjs "https://$host" "$GITHUB_SHA"
          printf 'App Service: https://%s\nVerified build commit: %s\n' "$host" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
