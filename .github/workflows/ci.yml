name: CI

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BSA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BSA/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Advisory content report
        continue-on-error: true
        run: npm run check:content
      - run: npx playwright install --with-deps chromium
      # Functional regressions and axe block; word counts and photographs report only.
      - run: npm run test:e2e -- --project=chromium --reporter=dot,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            BSA/playwright-report/
            BSA/test-results/
          retention-days: 14