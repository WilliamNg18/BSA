# Synthetic demonstration only. No live model or payment processing.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: bsa-synthetic-demo
resourceGroup: ${AZURE_RESOURCE_GROUP}
infra:
  provider: bicep
  path: infra
  module: main
services:
  web:
    project: .
    language: js
    host: appservice
    dist: dist
hooks:
  preup:
    shell: pwsh
    run: ./scripts/Initialize-AzureDemo.ps1
    interactive: false
  preprovision:
    shell: pwsh
    run: ./scripts/Initialize-AzureDemo.ps1
    interactive: false
  postprovision:
    shell: pwsh
    run: ./scripts/Set-DemoFederation.ps1
    interactive: false